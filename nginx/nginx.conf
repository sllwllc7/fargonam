# Fargonam — production nginx (docker-compose.prod.yml'dagi nginx xizmati)
# api.fargonam.uz  -> backend (FastAPI, docker tarmog'i orqali)
# fargonam.uz       -> APK yuklab olish sahifasi (statik)

resolver 127.0.0.11 valid=30s;
server_names_hash_bucket_size 64;

server {
    listen 80;
    server_name api.fargonam.uz fargonam.uz;

    # certbot ACME challenge — ikkala domen uchun ham shu yerdan
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.fargonam.uz;

    ssl_certificate     /etc/nginx/certs/live/api.fargonam.uz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/api.fargonam.uz/privkey.pem;

    set $backend http://backend:8000;
    client_max_body_size 10M;

    # API
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Statik fayllar
    location /static/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # MinIO (S3) — S3_PUBLIC_URL=/s3 shu yerga tushadi. Bucket nomi
    # (fargonam) yo'lga qaytariladi, chunki backend s3_public_url()
    # uni public URL'ga qo'shmaydi (S3_PUBLIC_URL bucket ildiziga ishora
    # qiladi deb hisoblanadi).
    location /s3/ {
        rewrite ^/s3/(.*)$ /fargonam/$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Admin web panel
    location /admin-web/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # API docs
    location /docs {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Health check
    location /health {
        proxy_pass $backend;
    }

    # Root — barcha API endpointlari shu yerda (prefikssiz)
    location / {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name fargonam.uz;

    ssl_certificate     /etc/nginx/certs/live/api.fargonam.uz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/api.fargonam.uz/privkey.pem;

    root /var/www/downloads;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.apk$ {
        add_header Content-Disposition "attachment";
        add_header Content-Type "application/vnd.android.package-archive";
    }
}
