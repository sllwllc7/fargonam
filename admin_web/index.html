<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fargonam — Admin Panel</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a10;--sb:#0d0d16;--s1:#121218;--s2:#18181f;--s3:#1e1e28;
  --b1:#222230;--b2:#2a2a3a;
  --cream:#e8d5b0;--cdim:#c9b48a;
  --pu:#6c5ce7;--pudim:#5a4bd1;
  --gr:#00b894;--re:#e17055;--or:#fd7c3a;--bl:#0984e3;--te:#00cec9;--ye:#fdcb6e;
  --t1:#f0ece4;--t2:#a8a4a0;--t3:#6a6678;
}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:4px}

/* ── LOGIN ── */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
.lbox{background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:36px;width:100%;max-width:400px}
.llogo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.llogo-ic{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--cream),var(--cdim));display:flex;align-items:center;justify-content:center;font-size:20px}
.llogo-tx{font-size:20px;font-weight:800}
.lsub{font-size:13px;color:var(--t3);margin-bottom:24px}
.fi{margin-bottom:14px}
.fi label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.fi input,.fi select,.fi textarea{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:11px 14px;color:var(--t1);font-size:14px;outline:none;transition:border-color .2s;font-family:inherit}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--pu)}
.fi input::placeholder{color:var(--t3)}
.fi textarea{resize:vertical;min-height:80px}
.fi select option{background:var(--s2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s,transform .1s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn:active{transform:scale(.97)}
.btn-full{width:100%}
.btn-primary{background:linear-gradient(135deg,var(--cream),var(--cdim));color:#1a1628}
.btn-purple{background:linear-gradient(135deg,var(--pu),var(--pudim));color:#fff}
.btn-ghost{background:transparent;color:var(--t3);font-weight:500;padding:8px 0}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:8px}
.btn-add{background:linear-gradient(135deg,var(--cream),var(--cdim));color:#1a1628}
.btn-gr{background:rgba(0,184,148,.15);border:1px solid rgba(0,184,148,.3);color:var(--gr)}
.btn-re{background:rgba(225,112,85,.15);border:1px solid rgba(225,112,85,.3);color:var(--re)}
.btn-bl{background:rgba(9,132,227,.15);border:1px solid rgba(9,132,227,.3);color:var(--bl)}
.btn-or{background:rgba(253,124,58,.15);border:1px solid rgba(253,124,58,.3);color:var(--or)}
.lerr{color:var(--re);font-size:13px;margin-top:10px;display:none}

/* ── LAYOUT ── */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}

/* ── SIDEBAR ── */
.sb{width:230px;min-width:230px;background:var(--sb);border-right:1px solid var(--b1);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:50;overflow-y:auto}
.sb-logo{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--b1)}
.sb-logo-ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--cream),var(--cdim));display:flex;align-items:center;justify-content:center;font-size:17px}
.sb-logo-tx{font-size:15px;font-weight:800}
.sb-sec{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);padding:14px 16px 6px}
.ni{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;color:var(--t2);font-size:13px;font-weight:500;border:none;background:transparent;width:100%;text-align:left;transition:background .15s,color .15s;border-left:2px solid transparent}
.ni:hover{background:var(--s2);color:var(--t1)}
.ni.on{background:rgba(108,92,231,.12);color:var(--pu);border-left-color:var(--pu)}
.ni .ic{width:16px;text-align:center;font-size:14px}
.nb{margin-left:auto;background:var(--re);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;min-width:18px;text-align:center}
.sb-bot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--b1)}
.adm-info{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.adm-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pu),var(--pudim));display:flex;align-items:center;justify-content:center;font-size:14px}
.adm-name{font-size:13px;font-weight:600}
.adm-role{font-size:11px;color:var(--t3)}
.btn-out{width:100%;padding:8px;border-radius:8px;background:var(--s2);border:1px solid var(--b1);color:var(--t3);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-out:hover{border-color:var(--re);color:var(--re)}

/* ── MAIN ── */
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--sb);border-bottom:1px solid var(--b1);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;gap:12px}
.tb-title{font-size:16px;font-weight:800}
.tb-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.content{padding:24px;flex:1}

/* ── STATS ── */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.sc{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--acc,var(--pu))}
.sc-ic{font-size:22px;margin-bottom:10px}
.sc-lbl{font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.sc-val{font-size:26px;font-weight:900}
.sc-sub{font-size:11px;color:var(--t3);margin-top:3px}

/* ── CARD/TABLE ── */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:14px;overflow:hidden;margin-bottom:20px}
.ch{padding:14px 18px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ct{font-size:14px;font-weight:700;flex:1}
.srch{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:7px 12px}
.srch input{background:transparent;border:none;outline:none;color:var(--t1);font-size:13px;width:180px}
.srch input::placeholder{color:var(--t3)}
.sel{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:7px 10px;color:var(--t1);font-size:13px;outline:none;cursor:pointer}
.sel option{background:var(--s2)}

table{width:100%;border-collapse:collapse}
thead th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);border-bottom:1px solid var(--b1);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--b1);transition:background .1s}
tbody tr:last-child{border:none}
tbody tr:hover{background:rgba(255,255,255,.02)}
td{padding:11px 14px;font-size:13px;vertical-align:middle}
.td2{color:var(--t2);font-size:12px}

/* ── BADGE ── */
.bge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600}
.bge::before{content:'';width:4px;height:4px;border-radius:50%;background:currentColor}
.bge-gr{background:rgba(0,184,148,.12);color:var(--gr)}
.bge-re{background:rgba(225,112,85,.12);color:var(--re)}
.bge-or{background:rgba(253,124,58,.12);color:var(--or)}
.bge-bl{background:rgba(9,132,227,.12);color:var(--bl)}
.bge-pu{background:rgba(108,92,231,.12);color:var(--pu)}
.bge-ye{background:rgba(253,203,110,.12);color:var(--ye)}
.bge-mu{background:var(--s2);color:var(--t3)}

/* ── PAGINATION ── */
.pg{display:flex;align-items:center;padding:12px 18px;border-top:1px solid var(--b1);gap:6px;flex-wrap:wrap}
.pg-info{font-size:12px;color:var(--t3);flex:1}
.pb{width:30px;height:30px;border-radius:7px;background:var(--s2);border:1px solid var(--b1);color:var(--t2);cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;display:flex;align-items:center;justify-content:center}
.pb:hover,.pb.on{background:var(--pu);border-color:var(--pu);color:#fff}
.pb:disabled{opacity:.3;cursor:not-allowed}

/* ── MODAL ── */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.mbg.open{display:flex}
.mbox{background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.mt{font-size:16px;font-weight:800;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.mc{background:var(--s2);border:none;color:var(--t2);width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:16px}
.mac{display:flex;gap:8px;margin-top:18px}
.mac .btn{flex:1}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;z-index:400;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.ti{background:var(--s1);border:1px solid var(--b2);border-radius:10px;padding:12px 16px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tsIn .25s ease;pointer-events:all}
.ti-ok{border-left:3px solid var(--gr)}
.ti-err{border-left:3px solid var(--re)}
.ti-info{border-left:3px solid var(--bl)}
@keyframes tsIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── EMPTY/LOADING ── */
.empty{text-align:center;padding:50px 20px;color:var(--t3)}
.empty-ic{font-size:40px;margin-bottom:10px}
.empty-tx{font-size:14px}
.spin{width:18px;height:18px;border:2px solid var(--b2);border-top-color:var(--pu);border-radius:50%;animation:sp .5s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.cload{text-align:center;padding:40px;color:var(--t3);display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px}

/* ── IMG ── */
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--s2);border:1px solid var(--b1)}
.thumb-sm{width:32px;height:32px;border-radius:6px}

/* ── BROADCAST ── */
.bcast{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:24px;max-width:560px}
.rbox{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:14px;margin-top:14px;font-size:13px;display:none}

/* ── DETAIL ROW ── */
.dr{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--b1)}
.dr:last-child{border:none}
.dr-lbl{font-size:12px;color:var(--t3);font-weight:600;width:130px;min-width:130px}
.dr-val{font-size:13px;flex:1;word-break:break-all}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .sb{transform:translateX(-100%);transition:transform .3s}
  .sb.mob-open{transform:translateX(0)}
  .main{margin-left:0}
  .sg{grid-template-columns:1fr 1fr}
  .srch input{width:120px}
}

/* ── FILE INPUT ── */
.fi-file{width:100%;background:var(--s2);border:1px dashed var(--b2);border-radius:10px;padding:14px;color:var(--t1);font-size:13px;cursor:pointer;transition:border-color .2s}
.fi-file:hover{border-color:var(--pu)}

/* ── TABS ── */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:4px;width:fit-content}
.tab{padding:7px 16px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--t3);transition:all .15s}
.tab.on{background:var(--pu);color:#fff}
/* ── TOGGLE ── */
.tog-wrap{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.tog-wrap input{display:none}
.tog-track{width:44px;height:24px;border-radius:12px;background:var(--b2);border:1px solid var(--b1);position:relative;transition:background .2s}
.tog-wrap input:checked+.tog-track{background:var(--gr);border-color:var(--gr)}
.tog-thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.tog-wrap input:checked+.tog-track .tog-thumb{transform:translateX(20px)}
.tog-lbl{font-size:13px;color:var(--t2)}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login">
  <div class="lbox">
    <div class="llogo">
      <div class="llogo-ic">🏙️</div>
      <span class="llogo-tx">Fargonam Admin</span>
    </div>
    <p class="lsub">Boshqaruv paneliga Telegram orqali kiring</p>
    <div id="s-tg">
      <button class="btn btn-primary btn-full" onclick="startTgLogin()" id="btnTg">Telegram orqali kirish</button>
      <p id="tgWait" style="display:none;font-size:13px;color:var(--t2);margin-top:14px;text-align:center;line-height:1.5">⏳ Ochilgan Telegram botida "Start" tugmasini bosing. Tasdiqlangach avtomatik kirasiz.</p>
    </div>
    <p id="lerr" class="lerr"></p>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app">
  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sb" id="sb">
      <div class="sb-logo">
        <div class="sb-logo-ic">🏙️</div>
        <span class="sb-logo-tx">Fargonam</span>
      </div>
      <div class="sb-sec">Asosiy</div>
      <button class="ni on" onclick="go('stats')"><span class="ic">📊</span> Statistika</button>

      <div class="sb-sec">Boshqaruv</div>
      <button class="ni" onclick="go('users')"><span class="ic">👥</span> Foydalanuvchilar</button>
      <button class="ni" onclick="go('shops')"><span class="ic">🏪</span> Do'konlar <span class="nb" id="nShops" style="display:none">0</span></button>
      <button class="ni" onclick="go('orders')"><span class="ic">📦</span> Buyurtmalar</button>
      <button class="ni" onclick="go('rides')"><span class="ic">🚖</span> Taksi buyurtmalar</button>

      <div class="sb-sec">Kontent</div>
      <button class="ni" onclick="go('categories')"><span class="ic">🗂️</span> Kategoriyalar</button>
      <button class="ni" onclick="go('products')"><span class="ic">🛒</span> Mahsulotlar</button>
      <button class="ni" onclick="go('news')"><span class="ic">📰</span> Yangiliklar</button>
      <button class="ni" onclick="go('banners')"><span class="ic">🖼️</span> Bannerlar</button>
      <button class="ni" onclick="go('announcements')"><span class="ic">📣</span> E'lonlar</button>

      <div class="sb-sec">Amallar</div>
      <button class="ni" onclick="go('broadcast')"><span class="ic">📢</span> Xabar yuborish</button>
      <button class="ni" onclick="go('appsettings')"><span class="ic">⚙️</span> Ilova sozlamalari</button>

      <div class="sb-bot">
        <div class="adm-info">
          <div class="adm-av">👤</div>
          <div>
            <div class="adm-name" id="admName">Admin</div>
            <div class="adm-role">Super Admin</div>
          </div>
        </div>
        <button class="btn-out" onclick="logout()">Chiqish</button>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <div class="topbar">
        <span class="tb-title" id="pgTitle">Statistika</span>
        <div class="tb-actions" id="tbAct"></div>
      </div>
      <div class="content" id="cnt"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="mbg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mbox" id="mbox"></div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ═══════════ CORE ═══════════
const BASE = '';
let TOKEN = localStorage.getItem('fg_tok') || '';

async function api(method, path, body, isForm = false) {
  const h = {};
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  if (!isForm) h['Content-Type'] = 'application/json';
  const opts = { method, headers: h };
  if (body !== undefined) opts.body = isForm ? body : JSON.stringify(body);
  const r = await fetch(BASE + path, opts);
  const ct = r.headers.get('content-type') || '';
  const data = ct.includes('json') ? await r.json().catch(() => ({})) : {};
  if (!r.ok) {
    const det = data.detail;
    const msg = typeof det === 'string' ? det
      : Array.isArray(det) ? det.map(e => e.msg || e.loc?.join('.')).join(', ')
      : `Xato ${r.status}`;
    throw new Error(msg);
  }
  return data;
}

function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `ti ti-${type}`;
  el.textContent = (type === 'ok' ? '✓ ' : type === 'err' ? '✕ ' : 'ℹ ') + msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function openModal(html) {
  document.getElementById('mbox').innerHTML = html;
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function setContent(html) {
  document.getElementById('cnt').innerHTML = html;
}

function loading() {
  setContent('<div class="cload"><span class="spin"></span> Yuklanmoqda...</div>');
}

function empty(msg = 'Ma\'lumot yo\'q') {
  return `<div class="empty"><div class="empty-ic">📭</div><div class="empty-tx">${msg}</div></div>`;
}

function fmt(dt) {
  if (!dt) return '—';
  return new Date(dt).toLocaleString('uz-UZ', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function fmtDate(dt) {
  if (!dt) return '—';
  return new Date(dt).toLocaleDateString('uz-UZ');
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function slugify(s) {
  return String(s || '')
    .toLowerCase()
    .replace(/['’‘ʻʼ`]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

// ═══════════ AUTH ═══════════
let TG_SESSION = null;
let TG_POLL = null;

async function startTgLogin() {
  const btn = document.getElementById('btnTg');
  btn.disabled = true; btn.textContent = 'Yuklanmoqda...';
  showLE('');
  try {
    const res = await api('POST', '/auth/telegram/session');
    TG_SESSION = res.session_id;
    window.open(res.bot_url, '_blank');
    document.getElementById('tgWait').style.display = 'block';
    btn.textContent = 'Kutilmoqda...';
    if (TG_POLL) clearInterval(TG_POLL);
    TG_POLL = setInterval(pollTgSession, 2000);
  } catch(e) {
    showLE(e.message);
    resetTgButton();
  }
}

async function pollTgSession() {
  if (!TG_SESSION) return;
  try {
    const r = await fetch(BASE + '/auth/telegram/session/' + TG_SESSION);
    if (r.status === 410) {
      clearInterval(TG_POLL); TG_POLL = null;
      showLE('Sessiya muddati tugadi, qaytadan urinib ko\'ring');
      resetTgButton();
      return;
    }
    const data = await r.json();
    if (data.status !== 'confirmed') return;
    clearInterval(TG_POLL); TG_POLL = null;
    TOKEN = data.access_token;
    localStorage.setItem('fg_tok', TOKEN);
    const me = await api('GET', '/auth/me');
    if (me.role !== 'admin') {
      TOKEN = ''; localStorage.removeItem('fg_tok');
      showLE('Sizda admin huquqi yo\'q');
      resetTgButton();
      return;
    }
    document.getElementById('admName').textContent = me.full_name || me.phone || 'Admin';
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    go('stats');
  } catch(_) { /* tarmoq xatosi — keyingi pollingda qaytadan urinamiz */ }
}

function resetTgButton() {
  document.getElementById('tgWait').style.display = 'none';
  const btn = document.getElementById('btnTg');
  btn.disabled = false; btn.textContent = 'Telegram orqali kirish';
}

function showLE(msg) {
  const el = document.getElementById('lerr');
  el.textContent = msg; el.style.display = msg ? 'block' : 'none';
}

function logout() {
  TOKEN = ''; localStorage.removeItem('fg_tok');
  location.reload();
}

// auto-login
if (TOKEN) {
  api('GET', '/auth/me').then(me => {
    if (me.role !== 'admin') {
      TOKEN=''; localStorage.removeItem('fg_tok');
      showLE('Sizda admin huquqi yo\'q');
      return;
    }
    document.getElementById('admName').textContent = me.full_name || me.phone || 'Admin';
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    go('stats');
  }).catch(() => { TOKEN=''; localStorage.removeItem('fg_tok'); });
}

// ═══════════ NAVIGATION ═══════════
const TITLES = {
  stats:'Statistika', users:'Foydalanuvchilar', shops:"Do'konlar",
  orders:'Buyurtmalar', rides:'Taksi buyurtmalar', categories:'Kategoriyalar',
  products:'Mahsulotlar',
  news:'Yangiliklar', banners:'Bannerlar', announcements:"E'lonlar",
  broadcast:'Xabar yuborish', appsettings:'Ilova sozlamalari'
};
const RENDERS = {
  stats, users, shops, orders, rides, categories, products, news, banners, announcements, broadcast, appsettings
};

function go(tab) {
  document.querySelectorAll('.ni').forEach(b => b.classList.remove('on'));
  document.querySelector(`.ni[onclick="go('${tab}')"]`)?.classList.add('on');
  document.getElementById('pgTitle').textContent = TITLES[tab] || tab;
  document.getElementById('tbAct').innerHTML = '';
  RENDERS[tab]?.();
}

// ═══════════ USERS ═══════════
let uPage = 1, uQ = '', uRole = '';
async function users(page = 1) {
  uPage = page;
  loading();
  document.getElementById('tbAct').innerHTML = '';
  try {
    const res = await api('GET', '/admin/users?limit=200');
    const all = res.items;
    let data = all.filter(u =>
      (!uQ || u.phone?.includes(uQ) || u.full_name?.toLowerCase().includes(uQ.toLowerCase())) &&
      (!uRole || u.role === uRole)
    );
    const total = data.length, ps = 20;
    data = data.slice((page-1)*ps, page*ps);
    const pages = Math.ceil(total/ps);

    setContent(`
      <div class="card">
        <div class="ch">
          <span class="ct">Foydalanuvchilar (${total})</span>
          <div class="srch"><span>🔍</span><input placeholder="Qidirish..." value="${esc(uQ)}" oninput="uQ=this.value;users(1)" /></div>
          <select class="sel" onchange="uRole=this.value;users(1)">
            <option value="">Barcha rollar</option>
            <option value="buyer" ${uRole==='buyer'?'selected':''}>Buyer</option>
            <option value="seller" ${uRole==='seller'?'selected':''}>Seller</option>
            <option value="admin" ${uRole==='admin'?'selected':''}>Admin</option>
            <option value="driver" ${uRole==='driver'?'selected':''}>Driver</option>
          </select>
        </div>
        <table>
          <thead><tr>
            <th>#ID</th><th>Telefon</th><th>Ism</th><th>Rol</th><th>Holat</th><th>Sana</th><th>Amallar</th>
          </tr></thead>
          <tbody>
            ${data.length ? data.map(u => `
            <tr>
              <td class="td2">${u.id}</td>
              <td><b>${esc(u.phone)}</b></td>
              <td>${esc(u.full_name || '—')}</td>
              <td>${roleBadge(u.role)}</td>
              <td>${u.is_active ? '<span class="bge bge-gr">Faol</span>' : '<span class="bge bge-re">Bloklangan</span>'}</td>
              <td class="td2">${fmtDate(u.created_at)}</td>
              <td>
                <button class="btn btn-sm ${u.is_active?'btn-re':'btn-gr'}" onclick="toggleUser(${u.id},${u.is_active})">

              </td>

    `);
  } catch(e) { setContent(`<div class="empty"><div class="empty-tx">${e.message}</div></div>`); }

function roleBadge(r) {
  const map = { admin:'bge-pu', seller:'bge-bl', buyer:'bge-gr', driver:'bge-or' };
  const labels = { admin:'Admin', seller:'Sotuvchi', buyer:'Mijoz', driver:'Haydovchi' };
  return `<span class="bge ${map[r]||'bge-mu'}">${labels[r]||r}</span>`;
}

async function toggleUser(id, isActive) {
  if (!confirm(isActive ? 'Foydalanuvchini bloklash?' : 'Foydalanuvchini faollashtirish?')) return;
  try {
    await api('PATCH', `/admin/users/${id}`, { is_active: !isActive });
    toast(isActive ? 'Bloklandi' : 'Faollashtirildi');
    users(uPage);
  } catch(e) { toast(e.message, 'err'); }
}

// ═══════════ SHOPS ═══════════

  document.getElementById('tbAct').innerHTML = '';
  try {
    const res = await api('GET', '/admin/shops?limit=200');
    const all = res.items;
    const pending = all.filter(s => s.status === 'pending');
    const nb = document.getElementById('nShops');
    if (pending.length > 0) { nb.textContent = pending.length; nb.style.display = ''; }
    else nb.style.display = 'none';

    const data = shFilter === 'all' ? all : all.filter(s => s.status === shFilter);

    setContent(`
      <div class="tabs">
        <button class="tab ${shFilter==='all'?'on':''}" onclick="shFilter='all';shops()">Hammasi (${all.length})</button>
        <button class="tab ${shFilter==='pending'?'on':''}" onclick="shFilter='pending';shops()">Kutmoqda (${pending.length})</button>
        <button class="tab ${shFilter==='approved'?'on':''}" onclick="shFilter='approved';shops()">Tasdiqlangan (${all.filter(s=>s.status==='approved').length})</button>
        <button class="tab ${shFilter==='rejected'?'on':''}" onclick="shFilter='rejected';shops()">Rad etilgan (${all.filter(s=>s.status==='rejected').length})</button>
      </div>
      <div class="card">
        <div class="ch"><span class="ct">Do'konlar (${data.length})</span></div>
        <table>
          <thead><tr>
            <th>#ID</th><th>Nomi</th><th>Egasi</th><th>Holat</th><th>Mahsulotlar</th><th>Sana</th><th>Amallar</th>
          </tr></thead>
          <tbody>
            ${data.length ? data.map(s => `
            <tr>
              <td class="td2">${s.id}</td>
              <td><b>${esc(s.name)}</b>${s.description ? `<div class="td2">${esc(s.description.substring(0,50))}</div>` : ''}</td>
              <td class="td2">${s.owner_phone || s.owner_id}</td>
              <td>${shopBadge(s.status)}</td>
              <td class="td2">${s.product_count ?? 0}</td>
              <td class="td2">${fmtDate(s.created_at)}</td>
              <td style="display:flex;gap:6px;flex-wrap:wrap">
                ${s.status !== 'approved' ? `<button class="btn btn-sm btn-gr" onclick="approveShop(${s.id},'approved')">✓ Tasdiqlash</button>` : ''}
                ${s.status !== 'rejected' ? `<button class="btn btn-sm btn-re" onclick="approveShop(${s.id},'rejected')">✕ Rad</button>` : ''}
              </td>

function shopBadge(s) {
  if (s === 'approved') return '<span class="bge bge-gr">Tasdiqlangan</span>';
  if (s === 'rejected') return '<span class="bge bge-re">Rad etilgan</span>';
  return '<span class="bge bge-ye">Kutmoqda</span>';
}

async function approveShop(id, status) {
  const label = status === 'approved' ? 'tasdiqlash' : 'rad etish';
  if (!confirm(`Do'konni ${label}?`)) return;
  try {
    await api('PATCH', `/admin/shops/${id}`, { status });
    toast(status === 'approved' ? 'Do\'kon tasdiqlandi ✓' : 'Do\'kon rad etildi');
    shops();
  } catch(e) { toast(e.message, 'err'); }
}

// Backend'dagi ALLOWED_TRANSITIONS (backend/app/api/cart.py) bilan sinxron
// saqlanishi kerak — o'zgarsa ikkalasini ham yangilash.
const ORDER_TRANSITIONS = {
  pending: ['paid', 'cancelled'],
  paid: ['shipped', 'cancelled'],
  shipped: ['delivered'],
  delivered: [],
  cancelled: [],
};
const ORDER_STATUS_LABELS = { pending:'Kutmoqda', paid:"To'langan", shipped:"Yo'lda", delivered:'Yetkazildi', cancelled:'Bekor qilindi' };

function orderStatusSelect(o) {
  const next = ORDER_TRANSITIONS[o.status] || [];
  if (!next.length) {
    return `<select class="sel" style="font-size:11px;padding:4px 8px" disabled><option>— (yakuniy holat)</option></select>`;
  }
  const opts = next.map(s => `<option value="${s}">${ORDER_STATUS_LABELS[s]}</option>`).join('');
  return `<select class="sel" style="font-size:11px;padding:4px 8px" onchange="changeOrderStatus(${o.id},this.value)">
    <option value="">Status o'zgartir</option>
    ${opts}
  </select>`;
}

function orderBadge(s) {
  const map = { pending:'bge-ye', paid:'bge-bl', shipped:'bge-or', delivered:'bge-gr', cancelled:'bge-re' };
  const lb = { pending:'Kutmoqda', paid:"To'langan", shipped:"Yo'lda", delivered:'Yetkazildi', cancelled:'Bekor' };
  return `<span class="bge ${map[s]||'bge-mu'}">${lb[s]||s}</span>`;
}

function formatSum(n) {
  if (!n) return '0 so\'m';
  return Number(n).toLocaleString('uz-UZ') + ' so\'m';
}

async function changeOrderStatus(id, status) {
  if (!status) return;
  try {
    await api('PATCH', `/admin/orders/${id}`, { status });
    toast('Status yangilandi');
    orders(ordPage);
  } catch(e) { toast(e.message, 'err'); }
}

    ));
    const catName = id => data.find(c => c.id === id)?.name;
    setContent(`
      <div class="card">
        <div class="ch"><span class="ct">Kategoriyalar (${data.length})</span></div>

          <tbody>

              <td class="td2">${c.id}</td>
              <td><b>${esc(c.name)}</b><div class="td2">${esc(c.slug)}</div></td>
              <td class="td2">${c.parent_id ? esc(catName(c.parent_id) || '—') : '—'}</td>

function openCategoryProducts(id) {
  pCategory = id;
  go('products');
}

async function addCategory() {
  let cats = [];
  try { cats = await api('GET', '/categories'); } catch(_) {}
  openModal(`
    <div class="mt">Yangi kategoriya <button class="mc" onclick="closeModal()">×</button></div>
    <div class="fi"><label>Nomi (o'zbekcha)</label><input id="cName" placeholder="Masalan: Ruchka" oninput="document.getElementById('cSlug').value=slugify(this.value)"/></div>
    <div class="fi"><label>Slug (avtomatik, kerak bo'lsa o'zgartiring)</label><input id="cSlug" placeholder="ruchka"/></div>
    <div class="fi">
      <label>Ota kategoriya (ixtiyoriy)</label>
      <select id="cParent">
        <option value="">— Yo'q (asosiy kategoriya) —</option>
        ${cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}
      </select>
    </div>
    <div class="mac">
      <button class="btn btn-primary" onclick="saveCategory()">Saqlash</button>
      <button class="btn" style="background:var(--s2);color:var(--t2)" onclick="closeModal()">Bekor</button>
    </div>
  `);
}

async function saveCategory() {
  const name = document.getElementById('cName').value.trim();
  const slug = document.getElementById('cSlug').value.trim() || slugify(name);
  const parent = document.getElementById('cParent').value;
  if (!name) return toast('Nom kiriting', 'err');
  if (!slug) return toast('Slug kiriting', 'err');
  try {
    await api('POST', '/categories', { name, slug, parent_id: parent ? Number(parent) : null });
    toast('Kategoriya qo\'shildi');
    closeModal(); categories();
  } catch(e) { toast(e.message, 'err'); }
}

async function deleteCategory(id, name) {
  if (!confirm(`"${name}" kategoriyasini o'chirish?`)) return;
  try {
    await api('DELETE', `/categories/${id}`);
    toast('O\'chirildi');
    categories();
  } catch(e) { toast(e.message, 'err'); }
}

// ═══════════ PRODUCTS ═══════════
let pPage = 1, pCategory = '', pCatMap = {};

async function products(page = 1) {
  pPage = page;
  loading();
  document.getElementById('tbAct').innerHTML = `<button class="btn btn-sm btn-add" onclick="addProduct()">+ Mahsulot qo'shish</button>`;
  try {
    const cats = await api('GET', '/categories');
    pCatMap = {}; cats.forEach(c => pCatMap[c.id] = c.name);
    const ps = 50;
    const qs = new URLSearchParams({ limit: String(ps), offset: String((page-1)*ps) });
    if (pCategory) qs.set('category_id', String(pCategory));
    const res = await api('GET', `/products?${qs.toString()}`);
    const total = res.total, pages = Math.ceil(total/ps);

    setContent(`
      <div class="card">
        <div class="ch">
          <span class="ct">Mahsulotlar (${total})</span>
          <select class="sel" onchange="pCategory=this.value;products(1)">
            <option value="">Barcha kategoriyalar</option>
            ${cats.map(c => `<option value="${c.id}" ${String(pCategory)===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}
          </select>
        </div>
        <table>
          <thead><tr><th>Rasm</th><th>Nomi</th><th>Kategoriya</th><th>Narx</th><th>Zaxira</th><th>Holat</th><th>Amallar</th></tr></thead>
          <tbody>
            ${res.items.length ? res.items.map(p => `
            <tr>
              <td>${p.image_url ? `<img class="thumb" src="${esc(p.image_url)}" onerror="this.style.display='none'"/>` : '<div class="thumb"></div>'}</td>
              <td><b>${esc(p.name)}</b>${p.shop_name ? `<div class="td2">${esc(p.shop_name)}</div>` : ''}</td>
              <td class="td2">${esc(pCatMap[p.category_id] || '—')}</td>
              <td>${priceRange(p)}</td>
              <td class="td2">${p.total_stock ?? 0} dona</td>
              <td>${p.is_active ? '<span class="bge bge-gr">Faol</span>' : '<span class="bge bge-re">Nofaol</span>'}</td>
              <td style="display:flex;gap:6px;flex-wrap:wrap">
                <button class="btn btn-sm" style="background:var(--s3);color:var(--t2)" onclick="toggleProduct(${p.id},${p.is_active})">${p.is_active?'O\'chirish':'Yoqish'}</button>
                <button class="btn btn-sm btn-re" onclick="deleteProduct(${p.id})">Butunlay o'chirish</button>
              </td>
            </tr>`).join('') : `<tr><td colspan="7">${empty('Mahsulot yo\'q')}</td></tr>`}
          </tbody>
        </table>
        ${pagination(page, pages, total, ps, 'products')}
      </div>
    `);
  } catch(e) { setContent(`<div class="empty"><div class="empty-tx">${e.message}</div></div>`); }
}

function priceRange(p) {
  if (p.min_price == null) return '—';
  if (Number(p.min_price) === Number(p.max_price)) return formatSum(p.min_price);
  return `${formatSum(p.min_price)} – ${formatSum(p.max_price)}`;
}

async function addProduct() {
  let cats = [], shops = [];
  try { cats = await api('GET', '/categories'); } catch(_) {}
  try { const r = await api('GET', '/admin/shops?status=approved&limit=200'); shops = r.items || []; } catch(_) {}
  if (shops.length === 0) {
    toast("Avval kamida bitta do'konni tasdiqlang (Do'konlar bo'limi)", 'err');
    return;
  }
  openModal(`
    <div class="mt">Yangi mahsulot <button class="mc" onclick="closeModal()">×</button></div>
    <div class="fi"><label>Nomi</label><input id="pName" placeholder="Masalan: Alfa ruchka"/></div>
    <div class="fi">
      <label>Kategoriya</label>

// ═══════════ PAGINATION ═══════════
function pagination(page, pages, total, ps, fn) {
  if (pages <= 1) return `<div class="pg"><span class="pg-info">Jami: ${total} ta</span></div>`;
  const from = (page-1)*ps+1, to = Math.min(page*ps, total);
  let btns = '';
  const start = Math.max(1, page-2), end = Math.min(pages, page+2);
  if (start > 1) btns += `<button class="pb" onclick="${fn}(1)">1</button>`;
  if (start > 2) btns += `<span style="color:var(--t3);padding:0 4px">…</span>`;
  for (let i=start;i<=end;i++) btns += `<button class="pb ${i===page?'on':''}" onclick="${fn}(${i})">${i}</button>`;
  if (end < pages-1) btns += `<span style="color:var(--t3);padding:0 4px">…</span>`;
  if (end < pages) btns += `<button class="pb" onclick="${fn}(${pages})">${pages}</button>`;
  return `<div class="pg"><span class="pg-info">${from}–${to} / ${total}</span>${btns}</div>`;
}

          <th style="padding:10px 16px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);border-bottom:1px solid var(--b1)">Sozlama</th>
          <th style="padding:10px 16px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);border-bottom:1px solid var(--b1);min-width:220px">Qiymat</th>
          <th style="padding:10px 16px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);border-bottom:1px solid var(--b1)">Tavsif</th>
        </tr></thead>
        <tbody id="cfgBody">${rows}</tbody>
      </table>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="ch"><span class="ct">ℹ️ Versiya ma'lumotlari</span></div>
      <div style="padding:16px;color:var(--t2);font-size:13px;line-height:1.8">
        <div>Hozirgi <b style="color:var(--t1)">mobile_user</b> versiyasi: <code style="background:var(--s3);padding:2px 8px;border-radius:5px">1.0.0</code></div>
        <div>Hozirgi <b style="color:var(--t1)">mobile_seller</b> versiyasi: <code style="background:var(--s3);padding:2px 8px;border-radius:5px">1.0.0</code></div>
        <div style="margin-top:8px;color:var(--t3)">Min versiyani joriy versiyadan katta qilsangiz — foydalanuvchilar majburiy yangilanadi.</div>
      </div>
    </div>
  `);
}

async function cfgSave(key, value) {
  try {
    await api('PUT', `/app-config/${key}`, { value: String(value), description: CFG_META[key]?.desc || '' });
    toast(`${CFG_META[key]?.label || key} saqlandi ✓`);
  } catch(e) { toast('Xato: ' + (e.message || e), true); }
}

async function cfgToggle(key, checked) {
  const val = checked ? 'true' : 'false';
  const lbl = document.getElementById(`cfg_${key}_lbl`);
  if (lbl) lbl.textContent = checked ? 'Yoqilgan' : 'O\'chirilgan';
  await cfgSave(key, val);
}

// ═══════════ KEYBOARD ═══════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
