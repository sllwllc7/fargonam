# Fargonam — Production deployment
# Ishga tushirish: docker compose -f docker-compose.prod.yml up -d
# Loglar:         docker compose -f docker-compose.prod.yml logs -f

services:
  postgres:
    image: postgres:17-alpine
    container_name: fargonam_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-fargonam}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD kerak}
      POSTGRES_DB: ${DB_NAME:-fargonam_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fargonam}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fargonam_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_parol}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_parol}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2022-10-24T18-35-07Z
    container_name: fargonam_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fargonam_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY kerak}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"  # MinIO Console (admin uchun)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fargonam_backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY kerak (32+ belgi)}
      DEBUG: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fargonam_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: fargonam
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-/s3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  nginx:
    image: nginx:alpine
    container_name: fargonam_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro
      - ./nginx/downloads:/var/www/downloads:ro
    depends_on:
      - backend

volumes:
  pg_data:
  redis_data:
  minio_data:
  uploads:
