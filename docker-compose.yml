# Fargonam — local development uchun PostgreSQL va Redis
# Ishga tushirish: docker compose up -d
# To'xtatish:     docker compose down

services:
  postgres:
    image: postgres:17-alpine
    container_name: fargonam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fargonam
      POSTGRES_PASSWORD: parol123
      POSTGRES_DB: fargonam_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fargonam_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
