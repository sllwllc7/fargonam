<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fargonam — Do'kon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F6;
    --surface: #FFFFFF;
    --primary: #16294A;
    --primary-dark: #0F1E38;
    --primary-mid: #2A4A7F;
    --primary-light: #E3ECFA;
    --success: #16A34A;
    --success-tint: #DCFCE7;
    --danger: #DC2626;
    --danger-tint: #FEE2E2;
    --text: #000000;
    --text-secondary: #1C1C22;
    --text-muted: #3F3F49;
    --border: #E0E6EF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; }
  .hidden { display: none !important; }

  /* ---- umumiy ---- */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 50px;
    border: none;
    border-radius: 12px;
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: -.2px;
    cursor: pointer;
    transition: transform .12s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(180deg, #24406F, #12233F);
    color: #EEF1F6;
    box-shadow: 0 8px 20px rgba(16,31,56,.28);
  }
  .btn-danger {
    background: var(--surface);
    color: var(--danger);
    border: 1.5px solid var(--danger-tint);
  }
  .btn-secondary {
    background: var(--surface);
    color: var(--text-secondary);
    border: 1.5px solid var(--border);
  }
  .btn:disabled { opacity: .5; cursor: default; }
  input[type=text], input[type=password], input[type=tel], textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 16px;
    font-family: inherit;
    color: var(--text);
  }
  input:focus, textarea:focus { outline: 2px solid var(--primary-mid); outline-offset: 1px; }

  /* ---- markazlashtirilgan ekran (login/ism) ---- */
  .center-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .center-card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: 0 1px 2px rgba(23,19,39,.04), 0 12px 26px -16px rgba(23,19,39,.08);
    padding: 32px 26px;
  }
  .center-card .logo {
    width: 56px; height: 56px; border-radius: 16px;
    background: var(--primary); color: #EEF1F6;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; margin-bottom: 18px;
  }
  .center-card h1 { font-size: 22px; font-weight: 800; letter-spacing: -.5px; margin: 0 0 6px; }
  .center-card p { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin: 0 0 20px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  .error-box {
    background: var(--danger-tint); color: var(--danger);
    border-radius: 10px; padding: 12px 14px; font-size: 13.5px;
    font-weight: 600; margin-bottom: 14px; line-height: 1.4;
  }

  /* ---- asosiy ekran ---- */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 16px 16px 0;
  }
  .topbar-row, .tabs { max-width: 640px; margin-left: auto; margin-right: auto; }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .topbar h1 { font-size: 21px; font-weight: 800; letter-spacing: -.4px; margin: 0; }
  .topbar .whoami { font-size: 12.5px; color: var(--text-muted); }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-secondary);
  }
  .conn-banner {
    background: var(--danger); color: #fff;
    text-align: center; font-size: 13px; font-weight: 700;
    padding: 8px; border-radius: 10px; margin-bottom: 10px;
  }
  .tabs {
    display: flex; gap: 8px; overflow-x: auto;
    padding-bottom: 12px; -ms-overflow-style: none; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none;
    display: flex; align-items: center; gap: 6px;
    padding: 10px 16px; border-radius: 999px;
    background: var(--surface); border: 1.5px solid var(--border);
    font-size: 14px; font-weight: 700; color: var(--text-secondary);
    cursor: pointer; white-space: nowrap;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #EEF1F6; }
  .tab .count {
    min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
    background: rgba(0,0,0,.08); color: inherit;
    font-size: 11.5px; display: flex; align-items: center; justify-content: center;
  }
  .tab.active .count { background: rgba(255,255,255,.22); }

  main { padding: 4px 16px 40px; max-width: 640px; margin: 0 auto; }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--text-muted);
  }
  .empty-state .big { font-size: 16px; font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; }
  .empty-state .small { font-size: 13.5px; }

  .order-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 1px 2px rgba(23,19,39,.04), 0 12px 26px -16px rgba(23,19,39,.08);
    padding: 16px;
    margin-bottom: 14px;
  }
  .order-card.flash { animation: flashCard 1.6s ease; }
  @keyframes flashCard {
    0% { box-shadow: 0 0 0 3px var(--primary-mid); }
    100% { box-shadow: 0 1px 2px rgba(23,19,39,.04), 0 12px 26px -16px rgba(23,19,39,.08); }
  }
  .order-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .order-head .num { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
  .order-head .time { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .status-badge {
    font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 8px;
    white-space: nowrap;
  }
  .claimed-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 700; color: var(--primary-mid);
    background: var(--primary-light); border-radius: 8px; padding: 5px 10px;
    margin-top: 10px;
  }
  .row-line { height: 1px; background: var(--border); margin: 12px 0; }
  .customer-block { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .customer-name { font-size: 15px; font-weight: 700; }
  .customer-phone {
    font-size: 14px; font-weight: 700; color: var(--primary-mid);
    text-decoration: none; display: flex; align-items: center; gap: 5px;
  }
  .address-block { font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; margin-top: 8px; }
  .address-block .label { color: var(--text-muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; }
  .note-block {
    font-size: 13px; color: var(--text-secondary); background: var(--bg);
    border-radius: 10px; padding: 8px 12px; margin-top: 8px; line-height: 1.45;
  }
  .items-list { margin-top: 4px; }
  .item-row {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 8px 0; font-size: 13.5px; border-bottom: 1px solid rgba(0,0,0,.05);
  }
  .item-row:last-child { border-bottom: none; }
  .item-name { color: var(--text-secondary); }
  .item-price { font-weight: 700; white-space: nowrap; }
  .total-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1.5px solid var(--border);
  }
  .total-row .label { font-size: 14px; font-weight: 700; color: var(--text-muted); }
  .total-row .value { font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
  .cancel-reason {
    font-size: 13px; color: var(--danger); background: var(--danger-tint);
    border-radius: 10px; padding: 8px 12px; margin-top: 10px; line-height: 1.4;
  }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions .btn { flex: 1; }
  .actions .btn-danger { flex: none; width: 50px; padding: 0; }

  /* ---- modal (bekor qilish sababi) ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,20,35,.5);
    display: flex; align-items: flex-end; justify-content: center; z-index: 20;
  }
  .modal-sheet {
    width: 100%; max-width: 420px; background: var(--surface);
    border-radius: 22px 22px 0 0; padding: 22px 20px 28px;
  }
  .modal-sheet h2 { font-size: 18px; font-weight: 800; margin: 0 0 4px; }
  .modal-sheet p { font-size: 13.5px; color: var(--text-muted); margin: 0 0 14px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions .btn { flex: 1; }

  .toast {
    position: fixed; left: 16px; right: 16px; bottom: 20px; z-index: 30;
    background: #171327; color: #EEF1F6; border-radius: 14px;
    padding: 13px 16px; font-size: 14px; font-weight: 600;
    text-align: center; max-width: 420px; margin: 0 auto;
    box-shadow: 0 12px 26px -10px rgba(0,0,0,.4);
  }

  @media (min-width: 640px) {
    main { padding-top: 8px; }
  }

  /* ---- buyurtma ichi (detail) ---- */
  .detail-back {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-size: 15px; font-weight: 700; color: var(--text);
    padding: 6px 0;
  }
  .detail-topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .detail-num { font-size: 19px; font-weight: 800; letter-spacing: -.3px; margin-top: 2px; }
  .muted-val { color: var(--text-muted); font-weight: 600; font-style: italic; }

  .item-card-big {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; overflow: hidden; margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(23,19,39,.04), 0 12px 26px -16px rgba(23,19,39,.08);
  }
  .item-card-big .img-wrap {
    width: 100%; aspect-ratio: 1 / 1; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    cursor: zoom-in; overflow: hidden;
  }
  .item-card-big .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item-card-big .img-wrap .cat-icon { width: 45%; height: 45%; color: var(--primary-mid); }
  .item-card-big .info { padding: 14px 16px 16px; }
  .item-card-big .p-name { font-size: 16.5px; font-weight: 800; letter-spacing: -.2px; line-height: 1.3; }
  .item-card-big .p-variant { font-size: 13.5px; color: var(--text-muted); margin-top: 3px; }
  .item-card-big .qty-row {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-top: 14px; padding-top: 12px; border-top: 1.5px solid var(--border);
  }
  .item-card-big .qty-big {
    font-size: 40px; font-weight: 800; letter-spacing: -1px; color: var(--primary);
    line-height: 1;
  }
  .item-card-big .qty-label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .item-card-big .price-val { font-size: 16px; font-weight: 700; text-align: right; }
  .item-card-big .price-label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; text-align: right; }

  .info-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 16px; margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(23,19,39,.04), 0 12px 26px -16px rgba(23,19,39,.08);
  }

  .zoom-overlay {
    position: fixed; inset: 0; background: rgba(10,14,25,.94); z-index: 40;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .zoom-overlay img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
  .zoom-overlay .zoom-cat-icon { width: 55vw; max-width: 260px; color: #EEF1F6; }
  .zoom-close {
    position: fixed; top: 18px; right: 18px; width: 44px; height: 44px;
    border-radius: 999px; background: rgba(255,255,255,.12); color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="screenLogin" class="center-screen hidden">
  <div class="center-card">
    <div class="logo">F</div>
    <h1>Fargonam Do'kon</h1>
    <p>Buyurtmalarni ko'rish va tayyorlash uchun kiring.</p>
    <div id="loginError" class="error-box hidden"></div>
    <form id="loginForm">
      <div class="field">
        <label for="loginInput">Login</label>
        <input type="text" id="loginInput" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="passwordInput">Parol</label>
        <input type="password" id="passwordInput" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:6px" id="loginBtn">Kirish</button>
    </form>
  </div>
</div>

<!-- ============ ISM SO'RASH ============ -->
<div id="screenName" class="center-screen hidden">
  <div class="center-card">
    <div class="logo">F</div>
    <h1>Ismingiz kim?</h1>
    <p>Buyurtmani kim olganini bilish uchun kerak. Bir marta kiritasiz.</p>
    <div id="nameError" class="error-box hidden"></div>
    <form id="nameForm">
      <div class="field">
        <label for="nameInput">Ism</label>
        <input type="text" id="nameInput" placeholder="Masalan: Aziz" autocomplete="name" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:6px">Davom etish</button>
    </form>
  </div>
</div>

<!-- ============ ASOSIY EKRAN ============ -->
<div id="screenMain" class="hidden">
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <h1>Buyurtmalar</h1>
        <div class="whoami" id="whoamiLabel"></div>
      </div>
      <div class="icon-btn" id="logoutBtn" title="Chiqish">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div id="connBanner" class="conn-banner hidden">Ulanish yo'q, qayta urinilmoqda...</div>
    <div class="tabs" id="tabs"></div>
  </div>
  <main id="ordersList"></main>
</div>

<!-- ============ BUYURTMA ICHI ============ -->
<div id="screenDetail" class="hidden">
  <div class="topbar">
    <div class="topbar-row" style="max-width:640px;margin:0 auto;display:block">
      <div class="detail-back" id="backBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Orqaga</span>
      </div>
    </div>
  </div>
  <main id="detailContent"></main>
</div>

<div id="zoomOverlay" class="zoom-overlay hidden"></div>

<div id="toastHost"></div>

<script src="app.js"></script>
</body>
</html>
