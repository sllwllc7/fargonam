<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Asmo shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F6;
    --surface: #FFFFFF;
    --primary: #16294A;
    --primary-dark: #0F1E38;
    --primary-mid: #2A4A7F;
    --primary-light: #E3ECFA;
    --success: #16A34A;
    --success-tint: #DCFCE7;
    --danger: #DC2626;
    --danger-tint: #FEE2E2;
    --text: #000000;
    --text-secondary: #1C1C22;
    --text-muted: #3F3F49;
    --border: #E0E6EF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding-bottom: 84px;
  }
  button { font-family: inherit; }
  .hidden { display: none !important; }
  img { -webkit-user-drag: none; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 52px; border: none; border-radius: 12px;
    font-size: 15.5px; font-weight: 700; letter-spacing: -.2px;
    cursor: pointer; transition: transform .12s ease; width: 100%;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(180deg, #24406F, #12233F);
    color: #EEF1F6;
    box-shadow: 0 8px 20px rgba(16,31,56,.28), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .btn-secondary {
    background: var(--surface); color: var(--text-secondary);
    border: 1.5px solid var(--border);
  }
  .btn:disabled { opacity: .55; cursor: default; }

  textarea, input[type=text] {
    width: 100%; border: 1.5px solid var(--border); background: var(--surface);
    border-radius: 12px; padding: 13px 15px; font-size: 15.5px;
    font-family: inherit; color: var(--text); resize: none;
  }
  textarea:focus, input:focus { outline: 2px solid var(--primary-mid); outline-offset: 1px; }
  label.field-label { display: block; font-size: 13px; font-weight: 700; color: var(--text-secondary); margin: 0 0 6px; }

  .topbar {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(16px + env(safe-area-inset-top)) 16px 10px;
  }
  .topbar h1 { font-size: 22px; font-weight: 800; letter-spacing: -.5px; margin: 0; }
  .topbar .sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .back-row {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-size: 15px; font-weight: 700; color: var(--text); padding: 4px 0 10px;
  }

  main { padding: 4px 16px 24px; max-width: 560px; margin: 0 auto; }

  /* ---- markazlashtirilgan ekran ---- */
  .center-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .center-card {
    width: 100%; max-width: 380px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 22px;
    box-shadow: 0 1px 2px rgba(23,19,39,.04), 0 12px 26px -16px rgba(23,19,39,.08);
    padding: 32px 26px; text-align: center;
  }
  .center-card .logo {
    width: 56px; height: 56px; border-radius: 16px; background: var(--primary); color: #EEF1F6;
    display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800;
    margin: 0 auto 18px;
  }
  .center-card h1 { font-size: 21px; font-weight: 800; letter-spacing: -.4px; margin: 0 0 6px; }
  .center-card p { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin: 0 0 20px; }
  .spinner {
    width: 26px; height: 26px; border-radius: 999px; margin: 0 auto 14px;
    border: 3px solid var(--primary-light); border-top-color: var(--primary-mid);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    background: var(--danger-tint); color: var(--danger); border-radius: 10px;
    padding: 12px 14px; font-size: 13.5px; font-weight: 600; margin-bottom: 14px; line-height: 1.4;
  }

  /* ---- kategoriya grid ---- */
  .cat-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 6px;
  }
  .cat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 16px 14px; box-shadow: 0 1px 2px rgba(23,19,39,.04), 0 12px 26px -16px rgba(23,19,39,.08);
    cursor: pointer; transition: transform .12s ease;
  }
  .cat-card:active { transform: scale(.96); }
  .cat-badge {
    width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center;
    justify-content: center; font-size: 17px; font-weight: 800; margin-bottom: 10px;
  }
  .cat-card .name { font-size: 14.5px; font-weight: 700; letter-spacing: -.2px; line-height: 1.3; }
  .cat-card .count { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

  /* ---- mahsulot ro'yxati ---- */
  .prod-card {
    display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 12px; margin-bottom: 12px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(23,19,39,.04), 0 12px 26px -16px rgba(23,19,39,.08);
    transition: transform .12s ease;
  }
  .prod-card:active { transform: scale(.98); }
  .prod-thumb {
    width: 64px; height: 64px; border-radius: 12px; background: var(--primary-light);
    flex: none; display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .prod-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .prod-thumb .ic { width: 46%; height: 46%; color: var(--primary-mid); }
  .prod-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .prod-info .name {
    font-size: 14.5px; font-weight: 700; letter-spacing: -.2px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .prod-info .price { font-size: 15px; font-weight: 800; letter-spacing: -.2px; margin-top: 5px; color: var(--primary); }
  .prod-info .stock-out { font-size: 12px; font-weight: 700; color: var(--danger); margin-top: 3px; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state .big { font-size: 16px; font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; }
  .empty-state .small { font-size: 13.5px; line-height: 1.45; }

  /* ---- mahsulot detali ---- */
  .detail-img {
    width: 100%; aspect-ratio: 1/1; border-radius: 18px; background: var(--surface);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    overflow: hidden; margin-bottom: 16px;
  }
  .detail-img img { width: 100%; height: 100%; object-fit: cover; }
  .detail-img .ic { width: 40%; height: 40%; color: var(--primary-mid); }
  .detail-name { font-size: 19px; font-weight: 800; letter-spacing: -.4px; line-height: 1.3; margin-bottom: 6px; }
  .detail-price { font-size: 22px; font-weight: 800; letter-spacing: -.4px; color: var(--primary); margin-bottom: 16px; }
  .detail-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.55; margin-bottom: 18px; }

  .variant-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .variant-chip {
    padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--border);
    background: var(--surface); font-size: 13.5px; font-weight: 700; color: var(--text-secondary);
    cursor: pointer;
  }
  .variant-chip.active { background: var(--primary); border-color: var(--primary); color: #EEF1F6; }
  .variant-chip.disabled { opacity: .45; cursor: default; }

  .qty-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 14px; margin-bottom: 18px;
  }
  .qty-row .label { font-size: 13.5px; font-weight: 700; color: var(--text-secondary); }
  .qty-ctrl { display: flex; align-items: center; gap: 14px; }
  .qty-btn {
    width: 34px; height: 34px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--bg); display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; font-weight: 800; color: var(--primary);
  }
  .qty-val { font-size: 16px; font-weight: 800; min-width: 20px; text-align: center; }
  .stock-note { font-size: 12.5px; color: var(--text-muted); margin-top: -10px; margin-bottom: 18px; }

  /* ---- savat ---- */
  .cart-item {
    display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 12px; margin-bottom: 12px;
  }
  .cart-item .name { font-size: 14px; font-weight: 700; letter-spacing: -.1px; line-height: 1.3; }
  .cart-item .price { font-size: 13.5px; color: var(--text-muted); margin-top: 3px; }
  .cart-item .row2 { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .cart-item .line-total { font-size: 14.5px; font-weight: 800; color: var(--primary); }
  .cart-remove {
    width: 30px; height: 30px; border-radius: 9px; border: 1.5px solid var(--danger-tint);
    background: var(--surface); color: var(--danger); display: flex; align-items: center;
    justify-content: center; cursor: pointer; flex: none;
  }
  .cart-summary {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; margin-top: 6px;
  }
  .cart-summary .row { display: flex; justify-content: space-between; align-items: center; }
  .cart-summary .label { font-size: 14px; font-weight: 700; color: var(--text-muted); }
  .cart-summary .value { font-size: 21px; font-weight: 800; letter-spacing: -.3px; }

  /* ---- checkout ---- */
  .seg {
    display: flex; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 4px; margin-bottom: 18px;
  }
  .seg button {
    flex: 1; border: none; background: transparent; padding: 11px 8px; border-radius: 11px;
    font-size: 13.5px; font-weight: 700; color: var(--text-secondary); cursor: pointer;
  }
  .seg button.active { background: var(--primary); color: #EEF1F6; }
  .field { margin-bottom: 16px; }

  /* ---- muvaffaqiyat ---- */
  .success-icon {
    width: 64px; height: 64px; border-radius: 999px; background: var(--success-tint);
    color: var(--success); display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  .pickup-code {
    font-size: 30px; font-weight: 800; letter-spacing: 4px; color: var(--primary);
    background: var(--primary-light); border-radius: 14px; padding: 14px; margin: 16px 0;
  }

  /* ---- buyurtmalar ro'yxati ---- */
  .order-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px; margin-bottom: 12px;
  }
  .order-card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .order-card .num { font-size: 15.5px; font-weight: 800; }
  .order-card .time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .status-badge { font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 8px; white-space: nowrap; }
  .order-card .items-summary { font-size: 13px; color: var(--text-secondary); margin-top: 8px; line-height: 1.4; }
  .order-card .total { font-size: 15px; font-weight: 800; color: var(--primary); margin-top: 8px; }

  /* ---- pastki tab bar ---- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 4px; border-radius: 12px; cursor: pointer; color: var(--text-muted);
    position: relative;
  }
  .tab-item.active { color: var(--primary); }
  .tab-item .lbl { font-size: 11px; font-weight: 700; }
  .tab-item .badge {
    position: absolute; top: 0; right: 18%; min-width: 16px; height: 16px; border-radius: 8px;
    background: var(--danger); color: #fff; font-size: 10px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; padding: 0 4px;
  }

  /* ---- pastda muallaq CTA (Savatga qo'shish va h.k.) ----
     Ekran mazmuni to'liq viewport'ni to'ldirsa ham (scroll yo'q holatda ham)
     tugma tabbar ostida qolib bosilmay qolmasin deb, oqim ichida emas,
     viewport'ga nisbatan qat'iy joylashadi. */
  .fixed-cta {
    position: fixed; left: 16px; right: 16px; max-width: 528px;
    margin: 0 auto; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 8;
  }
  .cta-spacer { height: 88px; }

  .toast {
    position: fixed; left: 16px; right: 16px; bottom: 92px; z-index: 30;
    background: #171327; color: #EEF1F6; border-radius: 14px; padding: 13px 16px;
    font-size: 14px; font-weight: 600; text-align: center; max-width: 420px; margin: 0 auto;
    box-shadow: 0 12px 26px -10px rgba(0,0,0,.4);
    /* Bildirishnoma — hech qachon interaktiv emas, tagidagi (fixed-cta)
       tugmani bosishga xalaqit bermasin */
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="screenLoading" class="center-screen hidden">
  <div class="center-card">
    <div class="spinner"></div>
    <h1>Asmo shop</h1>
    <p>Yuklanmoqda...</p>
  </div>
</div>

<div id="screenTelegramOnly" class="center-screen hidden">
  <div class="center-card">
    <div class="logo">A</div>
    <h1>Asmo shop</h1>
    <p>Bu ilova faqat Telegram ichida ishlaydi. Iltimos, Telegram orqali oching.</p>
  </div>
</div>

<div id="screenAuthError" class="center-screen hidden">
  <div class="center-card">
    <div class="logo">A</div>
    <h1>Asmo shop</h1>
    <div id="authErrorText" class="error-box"></div>
  </div>
</div>

<div id="app" class="hidden">

  <div id="screenCatalog">
    <div class="topbar">
      <h1>Asmo shop</h1>
      <div class="sub">O'quv qurollari do'koni</div>
    </div>
    <main>
      <div id="catGrid" class="cat-grid"></div>
    </main>
  </div>

  <div id="screenProducts" class="hidden">
    <div class="topbar">
      <div class="back-row" id="productsBack">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Kategoriyalar</span>
      </div>
      <h1 id="productsTitle"></h1>
    </div>
    <main id="productsList"></main>
  </div>

  <div id="screenProduct" class="hidden">
    <div class="topbar">
      <div class="back-row" id="productBack">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Orqaga</span>
      </div>
    </div>
    <main id="productDetail"></main>
  </div>

  <div id="screenCart">
    <div class="topbar"><h1>Savat</h1></div>
    <main id="cartList"></main>
  </div>

  <div id="screenCheckout" class="hidden">
    <div class="topbar">
      <div class="back-row" id="checkoutBack">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Savat</span>
      </div>
      <h1>Buyurtmani rasmiylashtirish</h1>
    </div>
    <main id="checkoutForm"></main>
  </div>

  <div id="screenSuccess" class="hidden">
    <main style="padding-top:60px">
      <div class="center-card" style="margin:0 auto">
        <div class="success-icon">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1>Buyurtma qabul qilindi</h1>
        <p id="successText"></p>
        <div id="successPickup" class="pickup-code hidden"></div>
        <button class="btn btn-primary" id="successContinueBtn">Xaridni davom ettirish</button>
      </div>
    </main>
  </div>

  <div id="screenOrders" class="hidden">
    <div class="topbar"><h1>Buyurtmalarim</h1></div>
    <main id="ordersList"></main>
  </div>

  <div class="tabbar">
    <div class="tab-item" data-tab="catalog">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span class="lbl">Katalog</span>
    </div>
    <div class="tab-item" data-tab="cart">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="20.5" r="1.4" fill="currentColor"/><circle cx="17" cy="20.5" r="1.4" fill="currentColor"/></svg>
      <span class="lbl">Savat</span>
      <span id="cartBadge" class="badge hidden">0</span>
    </div>
    <div class="tab-item" data-tab="orders">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M7 3h10l3 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M7 11h10M7 15h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="lbl">Buyurtmalar</span>
    </div>
  </div>

</div>

<div id="toastHost"></div>

<script src="app.js"></script>
</body>
</html>
